<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Français traduit en 9 langues via l'IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .description {
      color: #555;
      font-size: 16px;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    .video-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .video-block {
      position: relative;
      border-radius: 10px;
    }

    video {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 6px;
    }

    .audio-label {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 4px;
      pointer-events: none;
    }

    @media screen and (max-width: 900px) {
      .video-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <h1>Français traduit en 9 langues via l'IA</h1>
  <div class="description">
    Cliquez sur l’une des vidéos pour activer le son. Les deux démarrent ensemble, mais une seule est audible.
  </div>

  <div class="video-container">
    <div class="video-block">
      <div class="audio-label">🌍 Traduit</div>
      <video id="videoTraduite" controls muted>
        <source src="video-traduite.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>

    <div class="video-block">
      <div class="audio-label">🇫🇷 Français</div>
      <video id="videoFr" controls muted>
        <source src="video-fr.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </div>

  <script>
    const videoFr = document.getElementById('videoFr');
    const videoTraduite = document.getElementById('videoTraduite');

    function synchronizeAudio(target, other) {
      target.muted = false;
      other.muted = true;

      target.play();
      other.play();
    }

    videoFr.addEventListener('play', () => synchronizeAudio(videoFr, videoTraduite));
    videoTraduite.addEventListener('play', () => synchronizeAudio(videoTraduite, videoFr));

    // Par défaut, seule la vidéo traduite est audible
    videoFr.muted = true;
    videoTraduite.muted = false;
  </script>

</body>
</html>
