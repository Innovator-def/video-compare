<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Français traduit en 9 langues via l'IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .description {
      color: #555;
      font-size: 16px;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    .video-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .video-block {
      position: relative;
      background-color: #e0f0ff;
      border: 3px solid #007bff;
      border-radius: 10px;
      padding: 10px;
    }

    .video-block.traduite {
      background-color: #e6ffea;
      border-color: #28a745;
    }

    video {
      width: 400px;
      height: auto;
      border-radius: 6px;
    }

    .audio-button {
      margin-top: 10px;
      padding: 8px 14px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }

    .btn-fr {
      background-color: #007bff;
    }

    .btn-traduite {
      background-color: #28a745;
    }

    @media screen and (max-width: 900px) {
      .video-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <h1>Français traduit en 9 langues via l'IA</h1>
  <div class="description">
    Cliquez sur un des boutons pour écouter l'une des versions. Les deux vidéos démarrent ensemble, mais une seule aura le son.
  </div>

  <div class="video-container">
    <div class="video-block traduite">
      <video id="videoTraduite" controls muted>
        <source src="video-traduite.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
      <button class="audio-button btn-traduite" onclick="playWithAudio('videoTraduite')">🌍 Écouter la version traduite</button>
    </div>

    <div class="video-block">
      <video id="videoFr" controls muted>
        <source src="video-fr.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
      <button class="audio-button btn-fr" onclick="playWithAudio('videoFr')">🇫🇷 Écouter la version française</button>
    </div>
  </div>

  <script>
    const videoFr = document.getElementById('videoFr');
    const videoTraduite = document.getElementById('videoTraduite');

    function playWithAudio(targetId) {
      const target = document.getElementById(targetId);
      const other = targetId === 'videoFr' ? videoTraduite : videoFr;

      target.muted = false;
      other.muted = true;

      target.play();
      other.play();
    }

    // Par défaut, seule la vidéo traduite est audible
    videoFr.muted = true;
    videoTraduite.muted = false;
  </script>

</body>
</html>
