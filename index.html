<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Français traduit en 9 langues via l'IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .description {
      color: #555;
      font-size: 16px;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    .video-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .video-block {
      position: relative;
      max-width: 400px;
    }

    video {
      width: 100%;
      border-radius: 6px;
    }

    .audio-label {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #fff;
      background-color: rgba(0,0,0,0.6);
      color: #fff;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
    }

    @media screen and (max-width: 900px) {
      .video-container {
        flex-direction: column;
        align-items: center;
      }

      .video-block {
        width: 100%;
        max-width: 95vw;
      }

      video {
        width: 100%;
        height: auto;
      }

      .audio-label {
        font-size: 12px;
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>

  <h1>Français traduit en 9 langues via l'IA</h1>
  <div class="description">
    Cliquez sur l’une des vidéos pour lancer les deux. Seule la version choisie aura le son.
  </div>

  <div class="video-container">
    <div class="video-block">
      <div class="audio-label">🌍 Traduit</div>
      <video id="videoTraduite" controls playsinline muted>
        <source src="video-traduite.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>

    <div class="video-block">
      <div class="audio-label">🇫🇷 Français</div>
      <video id="videoFr" controls playsinline muted>
        <source src="video-fr.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </div>

  <script>
    const videoFr = document.getElementById('videoFr');
    const videoTraduite = document.getElementById('videoTraduite');

    // Quand l’utilisateur clique sur une vidéo, on synchronise la lecture
    function initSync(clicked, other) {
      // Activer le son sur la vidéo cliquée
      clicked.muted = false;
      // Désactiver le son sur l'autre
      other.muted = true;

      // Lancer les deux vidéos
      clicked.play();
      other.play();
    }

    // Synchroniser les pauses
    function syncPause(source, target) {
      source.addEventListener('pause', () => {
        if (!target.paused) target.pause();
      });
    }

    // Détecter un clic utilisateur sur chaque vidéo (et non juste play auto)
    videoFr.addEventListener('click', () => initSync(videoFr, videoTraduite));
    videoTraduite.addEventListener('click', () => initSync(videoTraduite, videoFr));

    // Synchronisation des pauses
    syncPause(videoFr, videoTraduite);
    syncPause(videoTraduite, videoFr);

    // État initial : seul la vidéo traduite est audible
    videoFr.muted = true;
    videoTraduite.muted = false;
  </script>

</body>
</html>
