<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Français traduit en 9 langues via l'IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
      color: #333;
    }
    .video-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    video {
      max-width: 45%;
      height: auto;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    .buttons {
      margin-top: 20px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Français traduit en 9 langues via l'IA</h1>

  <div class="buttons">
    <button onclick="togglePlay()">Lecture / Pause synchronisées</button>
  </div>

  <div class="video-container">
    <video id="videoTraduite" controls muted>
      <source src="video-traduite.mp4" type="video/mp4">
      Votre navigateur ne prend pas en charge la vidéo.
    </video>

    <video id="videoFr" controls muted>
      <source src="video-fr.mp4" type="video/mp4">
      Votre navigateur ne prend pas en charge la vidéo.
    </video>
  </div>

  <div class="buttons">
    <button onclick="toggleAudio('videoTraduite')">Activer audio vidéo traduite</button>
    <button onclick="toggleAudio('videoFr')">Activer audio vidéo française</button>
  </div>

  <script>
    const videoFr = document.getElementById('videoFr');
    const videoTraduite = document.getElementById('videoTraduite');

    function toggleAudio(id) {
      const selected = document.getElementById(id);
      const other = id === 'videoFr' ? videoTraduite : videoFr;

      selected.muted = false;
      other.muted = true;
    }

    function togglePlay() {
      if (videoFr.paused || videoTraduite.paused) {
        videoFr.play();
        videoTraduite.play();
      } else {
        videoFr.pause();
        videoTraduite.pause();
      }
    }

    // Par défaut : seule la vidéo traduite est audible
    videoTraduite.muted = false;
    videoFr.muted = true;
  </script>
</body>
</html>
