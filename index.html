<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Français traduit en 9 langues via l'IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding-top: 20px;
      margin: 0;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }

    .video-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .video-block {
      position: relative;
      display: inline-block;
    }

    video {
      max-width: 100%;
      width: 400px;
      height: auto;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    .audio-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
    }

    .audio-button:hover {
      opacity: 0.9;
    }

    #btnFr {
      background-color: #007bff; /* bleu */
    }

    #btnTraduite {
      background-color: #28a745; /* vert */
    }

    @media screen and (max-width: 900px) {
      .video-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <h1>Français traduit en 9 langues via l'IA</h1>

  <div class="video-container">
    <div class="video-block">
      <button id="btnTraduite" class="audio-button" onclick="playWithAudio('videoTraduite')">🌍 Traduit</button>
      <video id="videoTraduite" muted>
        <source src="video-traduite.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>

    <div class="video-block">
      <button id="btnFr" class="audio-button" onclick="playWithAudio('videoFr')">🇫🇷 Français</button>
      <video id="videoFr" muted>
        <source src="video-fr.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </div>

  <script>
    const videoFr = document.getElementById('videoFr');
    const videoTraduite = document.getElementById('videoTraduite');

    function playWithAudio(targetId) {
      const target = document.getElementById(targetId);
      const other = targetId === 'videoFr' ? videoTraduite : videoFr;

      target.muted = false;
      other.muted = true;

      target.play();
      other.play();
    }

    // Par défaut : seule la vidéo traduite a le son
    videoTraduite.muted = false;
    videoFr.muted = true;
  </script>

</body>
</html>
