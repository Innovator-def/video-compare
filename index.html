<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Français traduit en 9 langues via l'IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .description {
      color: #555;
      font-size: 16px;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    .video-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .video-block {
      position: relative;
      max-width: 400px;
    }

    video {
      width: 100%;
      border-radius: 6px;
    }

    .audio-label {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #fff;
      background-color: rgba(0,0,0,0.6);
      color: #fff;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
    }

    @media screen and (max-width: 900px) {
      .video-container {
        flex-direction: column;
        align-items: center;
      }

      .video-block {
        width: 100%;
        max-width: 95vw;
      }

      .audio-label {
        font-size: 12px;
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>

  <h1>Français traduit en 9 langues via l'IA</h1>
  <div class="description">
    Cliquez sur l’une des vidéos pour lancer les deux. Seule la version choisie aura le son.
  </div>

  <div class="video-container">
    <div class="video-block">
      <div class="audio-label">🌍 Traduit</div>
      <video id="videoTraduite" controls playsinline muted>
        <source src="video-traduite.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>

    <div class="video-block">
      <div class="audio-label">🇫🇷 Français</div>
      <video id="videoFr" controls playsinline muted>
        <source src="video-fr.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </div>

  <script>
    const videoTraduite = document.getElementById('videoTraduite');
    const videoFr = document.getElementById('videoFr');

    let activeVideo = null;

    function syncPlayback(clicked, other) {
      // Son sur la vidéo cliquée, silence sur l'autre
      clicked.muted = false;
      other.muted = true;

      // Synchroniser le temps si écart > 0.1s
      const delta = Math.abs(clicked.currentTime - other.currentTime);
      if (delta > 0.1) {
        other.currentTime = clicked.currentTime;
      }

      // Lancer les deux vidéos si ce n’est pas déjà fait
      if (clicked.paused) clicked.play();
      if (other.paused) other.play();

      activeVideo = clicked;
    }

    videoTraduite.addEventListener('play', () => {
      if (activeVideo !== videoTraduite) {
        syncPlayback(videoTraduite, videoFr);
      }
    });

    videoFr.addEventListener('play', () => {
      if (activeVideo !== videoFr) {
        syncPlayback(videoFr, videoTraduite);
      }
    });

    // Pause synchronisée
    videoTraduite.addEventListener('pause', () => {
      if (!videoFr.paused) videoFr.pause();
    });

    videoFr.addEventListener('pause', () => {
      if (!videoTraduite.paused) videoTraduite.pause();
    });

    // Initial: seule la vidéo traduite est audible
