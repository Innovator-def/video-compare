
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Français traduit en 9 langues via l'IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .description {
      color: #555;
      font-size: 16px;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    .video-container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .video-block {
      position: relative;
      width: 100%;
      max-width: 400px;
    }

    video {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .audio-label {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #fff;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
    }

    @media screen and (max-width: 768px) {
      .video-container {
        flex-direction: column;
        align-items: center;
      }

      .video-block {
        max-width: 95vw;
      }

      .audio-label {
        font-size: 12px;
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>

  <h1>Français traduit en 9 langues via l'IA</h1>
  <div class="description">
    Cliquez sur une des vidéos pour lancer les deux, puis sur l'autre :<br />
    seul le son de la version choisie sera audible.
  </div>

  <div class="video-container">
    <div class="video-block">
      <div class="audio-label">🌍 Traduit</div>
      <video id="videoTraduite" controls playsinline muted preload="auto">
        <source src="video-traduite.mp4" type="video/mp4" />
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>

    <div class="video-block">
      <div class="audio-label">🇫🇷 Français</div>
      <video id="videoFr" controls playsinline muted preload="auto">
        <source src="video-fr.mp4" type="video/mp4" />
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </div>

  <script>
    const videoTraduite = document.getElementById("videoTraduite");
    const videoFr = document.getElementById("videoFr");

    function launchBoth(clicked, other) {
      clicked.muted = false;
      other.muted = true;

      const time = clicked.currentTime;
      other.currentTime = time;

      clicked.play();
      other.play();
    }

    videoTraduite.addEventListener("play", () => {
      if (videoFr.paused) {
        launchBoth(videoTraduite, videoFr);
      }
    });

    videoFr.addEventListener("play", () => {
      if (videoTraduite.paused) {
        launchBoth(videoFr, videoTraduite);
      }
    });

    videoTraduite.addEventListener("pause", () => {
      if (!videoFr.paused) videoFr.pause();
    });

    // Supprimer cet événement pour permettre à la vidéo traduite de continuer
    // videoFr.addEventListener("pause", () => {
    //   if (!videoTraduite.paused) videoTraduite.pause();
    // });

    // Ne pas relancer la vidéo française une fois terminée
    videoFr.addEventListener("ended", () => {
      // Elle reste arrêtée, pas besoin de stopper la vidéo traduite
    });

    // Forcer le son unique même si l'utilisateur tente de réactiver l'autre piste
    videoFr.addEventListener("volumechange", () => {
      if (!videoTraduite.muted) {
        videoFr.muted = true;
      }
    });

    videoTraduite.addEventListener("volumechange", () => {
      if (!videoFr.muted) {
        videoTraduite.muted = true;
      }
    });

    // État initial
    videoFr.muted = true;
    videoTraduite.muted = false;
  </script>

</body>
</html>
