<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Français traduit en 9 langues via l'IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .description {
      color: #555;
      font-size: 16px;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    .video-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .video-block {
      position: relative;
      max-width: 400px;
    }

    video {
      width: 100%;
      border-radius: 6px;
    }

    .audio-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #fff;
      background-color: rgba(0,0,0,0.6);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .audio-button:hover {
      background-color: rgba(0,0,0,0.8);
    }

    @media screen and (max-width: 900px) {
      .video-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <h1>Français traduit en 9 langues via l'IA</h1>
  <div class="description">
    Cliquez sur un bouton pour écouter une version. Les deux vidéos sont synchronisées, une seule aura le son.
  </div>

  <div class="video-container">
    <div class="video-block">
      <button class="audio-button" onclick="togglePlayback('videoTraduite')">🌍 Traduit</button>
      <video id="videoTraduite" muted>
        <source src="video-traduite.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>

    <div class="video-block">
      <button class="audio-button" onclick="togglePlayback('videoFr')">🇫🇷 Français</button>
      <video id="videoFr" muted>
        <source src="video-fr.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
      </video>
    </div>
  </div>

  <script>
    const videoFr = document.getElementById('videoFr');
    const videoTraduite = document.getElementById('videoTraduite');

    let playing = null; // peut valoir 'videoFr', 'videoTraduite' ou null

    function togglePlayback(targetId) {
      const target = document.getElementById(targetId);
      const other = targetId === 'videoFr' ? videoTraduite : videoFr;

      if (playing === targetId) {
        // stop both
        target.pause();
        other.pause();
        target.currentTime = 0;
        other.currentTime = 0;
        target.muted = true;
        other.muted = true;
        playing = null;
      } else {
        // launch both
        target.muted = false;
        other.muted = true;
        target.play();
        other.play();
        playing = targetId;
      }
    }
  </script>

</body>
</html>
